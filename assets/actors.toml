[actors.ACTOR_OBJECT_KANKYO]
name = "Environment effect"
notes = "Effects drawn over a whole scene: the floating motes of Kokiri Forest, snow, the lightning of a cutscene, the spark from the Sun's Song engraving to the royal tomb, and the six beams of Ganon's Castle's barrier. Each is drawn at positions around the camera or fixed in the world, not at the actor, so it is a marker. The barrier beams are gone one by one as each trial is cleared."
draw = "marker"
scale = 0.01

[actors.ACTOR_OBJECT_KANKYO.params]
Type = { mask = 0xFFFF, kind = "choice", values = { 0 = "Forest motes", 2 = "Lightning", 3 = "Snow", 4 = "Sun's Song grave spark", 5 = "Barrier beams" } }

[actors.ACTOR_OBJ_ROOMTIMER]
name = "Room timer"
notes = "Starts a countdown when the room loads; when the room's enemies are all beaten it stops, sets the room clear flag and its switch flag. Running out voids Link out. Draws nothing, so it is a marker."
draw = "marker"
scale = 0.01

[actors.ACTOR_OBJ_ROOMTIMER.params]
Seconds = { mask = 0x03FF, kind = "number", description = "The time limit, at most 600; 0x3FF is no timer, only the clear" }
"Switch Flag" = { mask = 0xFC00, kind = "number", scene_flag = "switch", flag_use = "sets", description = "Set when the room is cleared" }

[actors.ACTOR_EN_VIEWER]
name = "Cutscene character"
notes = "Characters of the opening and Hyrule Field cutscenes: Zelda, Impa and Zelda's horse, young Ganondorf and his horse, and adult Ganondorf of the ending. Each is drawn only while a cutscene cues it (adult Ganondorf always), moved to the cue's positions; drawn here at the placement, at the first frame of its animation. The horses' skeletons are skins (drawn by func_800A6330), which Toki does not draw yet, so they are markers. Young Ganondorf spawns his cape (En_Ganon_Mant), which is drawn from his neck's position and is a child here at his feet; his left hand opens late in a cutscene, his eyes blink at fixed frames, and the giant one (Type 7) is scaled to 0.3 by Update. Zelda in Hyrule Field wears her cutscene dress with her hands and limbs 3, 5, 7, 8 and 9 hidden and her eyes looking aside; in the Temple of Time she holds the Ocarina of Time. Impa's segment 12 is pointed at &D_80116280[2] in the game's code. Shadows and the burning effect of Type 5 are not drawn."
