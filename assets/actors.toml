# Door_Shutter
[actors.ACTOR_DOOR_SHUTTER]
status = "checked"
name = "Sliding door"
description = "A door that slides up when Link walks in, barred or locked by its type; it looks like its dungeon."
notes = "A boss door's texture is picked by its scene, as sBossDoorInfo says. Each look has a back side too (DOORSHUTTER_GFX_*_2), and bars drawn while barred; only the front is drawn. Jabu-Jabu's door is built from sections in code."
