notes = "The Kokiri boss, who blocks the way to the Deku Tree until Link has a sword and shield. Spawns in Kokiri Forest before the Deku Tree is done, in his house after it while Link is a child, and always in the Lost Woods; the event flags are not modelled. Stands in gMidoIdleAnim, its first entry of sAnimationInfo."
