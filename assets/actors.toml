notes = "A door with a handle that Link opens by hand, a transition actor between two rooms or at a scene's exit. Its look is picked by its scene, as sDoorInfo says: the Fire Temple's, the Water Temple's, the Shadow Temple's (also in Bottom of the Well), the field door of gameplay_field_keep in every scene that loads it, else gameplay_keep's. The game draws the side facing the camera; both sides are drawn here, each one-sided as the game's are. A locked door draws the chains and padlock of gameplay_dangeon_keep while its switch flag is clear. A double door moves 30 units aside and spawns its twin turned about, drawn here as a second door. An ajar door stands open 34 degrees until Link comes near, not drawn. The evening door (Dampé's hut) is checkable outside 18:00 to 21:00."
