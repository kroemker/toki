notes = "An octopus that pops out of water and spits rocks. Init moves it to the surface of the water box above its placement, and kills it where there is none; that move is not drawn, so it is drawn at its placement. Unseen (no draw function) until Link is between 200 and 480 units away; drawn at the last frame of gOctorokAppearAnim, the animation it appears with. Any other type is the rock it spits, a billboard drawn 11 units up, spawned rather than placed."
object = "object_okuta"
scale = 0.01

