[actors.ACTOR_DEMO_EFFECT]
name = "Cutscene effect"
notes = "Effects of cutscenes: the spiritual stones, the three goddesses, coloured lights, the Triforce, medallions and the Master Sword's time warp. Nearly all are hidden or still until a cutscene cue moves, grows or fades them, and many are hidden while their cue is 1 or 2; they are drawn here as they look once shown. Texture scrolls are drawn at their first frame. Not drawn: the time warp (Master Sword and time blocks), a SkelCurve skeleton, and the dust of the light arrow cutscene, which draws nothing itself; both are markers. The jewels are turned 90 degrees about X by Init whatever their placement, and spin about Y; in the Temple of Time a child's jewels stay hidden until the Door of Time cutscene, and the Zora's Sapphire is gone in Jabu-Jabu once taken. Nayru is scale 1 and Farore 2.4 only when entering Death Mountain Trail or Kokiri Forest by their first entrance, approximated here by the scene. A light starts at scale 0 and grows to 0.23, or 2.03 when Light Size is set, on its cue; drawn grown. The Triforce Spot draws nothing until its cue fades it in, drawn here as the solid Triforce; its light column is left out, and the crystal light and light ring it spawns as children are left out, since they are scaled by the parent (0.6 and 0.4). A light ring that shrinks or follows the Triforce starts at alpha 0. Light Color is read only by a light; the other types often have its bits set."
object = "gameplay_keep"
scale = 0.2

