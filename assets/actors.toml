[actors.ACTOR_BOSS_GANONDROF]
name = "Phantom Ganon"
notes = "The Forest Temple's boss, riding his phantom horse (En_fHG, spawned as his child at his own position with his params). He is drawn in the ride pose of his intro with his mask off, his head swapped for gPhantomGanonFaceDL; his eyes' env colour starts at 0 and brightens during the fight. In the game he rides wherever the horse is: the horse's Init moves it to the room's centre at Y -300 whatever the placement, which is not drawn, so both are drawn at the placement. Params under 10 are the real boss (Init sets them to 1); 10 to 15 are the fake that the horse spawns in another painting, 10 plus its painting. Once the room is clear he is gone and spawns the blue warp at (14, -33, -3315) and a heart container at (214, -33, -3315), which are not drawn. The paintings are the room's own geometry, not actors."
object = "object_gnd"
scale = 0.01

[actors.ACTOR_BOSS_GANONDROF.params]
Type = { mask = 0xFFFF, kind = "number", signed = true, description = "Under 10 is the real boss; 10 to 15 a fake, in painting Type - 10, spawned by the horse" }

[[actors.ACTOR_BOSS_GANONDROF.variants]]
match = { Type = [10, 11, 12, 13, 14, 15] }
parts = [{ skeleton = "gPhantomGanonSkel", pose = "gPhantomGanonRideAnim", env = [0, 0, 0, 0] }]
children = [{ actor = "ACTOR_EN_FHG", params = 0x0000, take = { Type = "Type" }, offset = [0, 0, 0] }]

[[actors.ACTOR_BOSS_GANONDROF.variants]]
parts = [{ skeleton = "gPhantomGanonSkel", pose = "gPhantomGanonRidePoseAnim", limbs = { 15 = "gPhantomGanonFaceDL" }, env = [0, 0, 0, 0] }]
children = [{ actor = "ACTOR_EN_FHG", params = 0x0000, take = { Type = "Type" }, offset = [0, 0, 0] }]
default_params = 0xFFFF

[actors.ACTOR_EN_FHG]
name = "Phantom Ganon's horse"
notes = "The phantom horse Phantom Ganon rides, spawned by him with his params; it rides out of the paintings in his first phase and spawns the fake Phantom Ganon. Marked: its skeleton is a skin (Skin_Init, drawn by func_800A6330), which Toki does not draw yet; the variants say what it will be drawn with. The real boss's horse stands in its idle animation and Init moves it to the room's centre at Y -300 whatever its placement; a fake's gallops out of painting Type - 10. Init sets switch flag 0x14."
object = "object_fhg"
scale = 0.0115
height_offset = -2600
draw = "marker"

[actors.ACTOR_EN_FHG.params]
Type = { mask = 0xFFFF, kind = "number", signed = true, description = "1 is the real boss's horse; 10 to 15 a fake's, in painting Type - 10" }

[[actors.ACTOR_EN_FHG.variants]]
match = { Type = [10, 11, 12, 13, 14, 15] }
parts = [{ skeleton = "gPhantomHorseSkel", pose = "gPhantomHorseRunningAnim" }]

[[actors.ACTOR_EN_FHG.variants]]
parts = [{ skeleton = "gPhantomHorseSkel", pose = "gPhantomHorseIdleAnim" }]
default_params = 0x0001
