# En_Box
[actors.ACTOR_EN_BOX]
status = "checked"
name = "Treasure chest"
description = "A chest holding an item; small, large, or decorated for the boss key."
notes = "Child Link opens it with gTreasureChestAnim_000128; frame 0 of either is closed. Types 4 and 6 are seen only through the Lens of Truth, drawn here as always seen. Switch, room-clear and falling types appear only when their condition holds."
object = "object_box"
scale = 0.01
collision = "gTreasureChestCol"
rotates = { x = true, y = true, z = false }

[actors.ACTOR_EN_BOX.fields]
chest  = { kind = "integer", shift = 0, width = 5, role = "chest_flag", meaning = "Set once it is opened" }
item   = { kind = "integer", shift = 5, width = 7, role = "item", meaning = "The GI item it gives" }
type   = { kind = "enum", shift = 12, width = 4, values = { big = 0, room_clear_big = 1, boss_key = 2, falling_big = 3, lens_big = 4, small = 5, lens_small = 6, room_clear_small = 7, falling_small = 8, zeldas_lullaby = 9, suns_song = 10, switch_big = 11 } }
switch = { kind = "integer", source = "rotation_z", shift = 0, width = 6, role = "switch_flag", meaning = "The switch that makes a switch or falling chest appear" }

[[actors.ACTOR_EN_BOX.variants]]
match = { type = "boss_key" }
steps = [
    { colors = { env = [0, 0, 0, 255] } },
    { transform = { rotation = [0, 180, 0] } },
    { skeleton = "gTreasureChestSkel", animation = "gTreasureChestAnim_00024C", limbs = { 1 = [{ display_list = "gTreasureChestBossKeyChestFrontDL" }], 3 = [{ display_list = "gTreasureChestBossKeyChestSideAndTopDL" }] } },
]

[[actors.ACTOR_EN_BOX.variants]]
match = { type = ["small", "lens_small", "room_clear_small", "falling_small"] }
scale = 0.005
steps = [
    { colors = { env = [0, 0, 0, 255] } },
    { transform = { rotation = [0, 180, 0] } },
    { skeleton = "gTreasureChestSkel", animation = "gTreasureChestAnim_00024C", limbs = { 1 = [{ display_list = "gTreasureChestChestFrontDL" }], 3 = [{ display_list = "gTreasureChestChestSideAndLidDL" }] } },
]

[[actors.ACTOR_EN_BOX.variants]]
steps = [
    { colors = { env = [0, 0, 0, 255] } },
    { transform = { rotation = [0, 180, 0] } },
    { skeleton = "gTreasureChestSkel", animation = "gTreasureChestAnim_00024C", limbs = { 1 = [{ display_list = "gTreasureChestChestFrontDL" }], 3 = [{ display_list = "gTreasureChestChestSideAndLidDL" }] } },
]

# En_Karebaba
[actors.ACTOR_EN_KAREBABA]
status = "checked"
name = "Withered Deku Baba"
description = "A Deku Baba that lies withered in its leaves until Link comes close, then rises to bite."
notes = "Drawn as it waits (EnKarebaba_SetupIdle): its head pitched down at half scale 14 units above its leaves, its stem hanging from the head in three sections, under the ground until it rises. Params 0 makes it grow out of the ground first."
object = "object_dekubaba"
scale = 0.01
height_offset = 1400
rotates = { x = false, y = true, z = false }
shadow = { kind = "circle", size = 15 }

[[actors.ACTOR_EN_KAREBABA.variants]]
steps = [
    { transform = { rotation = [-90, 0, 0], scale = 0.5 } },
    { skeleton = "gDekuBabaSkel", animation = "gDekuBabaFastChompAnim" },
    { transform = { reset = true, rotation = [-90, 0, 0] } },
    { transform = { translation = [0, 0, -2000] } },
    { display_list = "gDekuBabaStemTopDL" },
    { transform = { translation = [0, 0, -2000] } },
    { display_list = "gDekuBabaStemMiddleDL" },
    { transform = { translation = [0, 0, -2000] } },
    { display_list = "gDekuBabaStemBaseDL" },
    { transform = { reset = true, translation = [0, -1400, 0] } },
    { display_list = "gDekuBabaBaseLeavesDL" },
]

# Obj_Syokudai
