[actors.ACTOR_DOOR_ANA]
name = "Grotto hole"
notes = "A hole in the ground that drops Link into a grotto. A hidden grotto is at scale 0, so invisible, until the Song of Storms is played near it or it is bombed or hammered, then grows to 0.01; it is drawn here as open. The game turns it to face the camera about Y every frame, which is not drawn: it is drawn unturned. Where it leads is Destination, or with Destination 0 the grotto rotation Z picks; Content is passed to the grotto scene as respawn data, which picks what that grotto holds."
object = "gameplay_field_keep"
scale = 0.01
rotates = { x = false, y = false, z = false }

[actors.ACTOR_DOOR_ANA.params]
Content = { mask = 0x00FF, kind = "number", hex = true, description = "Passed to the grotto it leads to, which picks its layout and contents from it" }
Hidden = { mask = 0x0300, kind = "choice", values = { 0 = "Open", 1 = "Opened by the Song of Storms", 2 = "Opened by explosives or a hammer", 3 = "Opened by explosives or a hammer (3)" } }
Destination = { mask = 0x7000, kind = "choice", values = { 0 = "From Grotto", 1 = "ENTR_FAIRYS_FOUNTAIN_0", 2 = "ENTR_GROTTOS_0", 3 = "ENTR_GROTTOS_1", 4 = "ENTR_GROTTOS_2", 5 = "ENTR_GROTTOS_3", 6 = "ENTR_GROTTOS_4", 7 = "ENTR_GROTTOS_5" }, description = "The entrance it leads to, entry Destination - 1 of sGrottoEntrances; 0 takes it from Grotto" }
Grotto = { mask = 0x000F, source = "rotation_z", kind = "choice", values = "sGrottoEntrances", offset = 1, description = "With Destination 0, the entrance is the one after this" }

[[actors.ACTOR_DOOR_ANA.variants]]
parts = [{ display_list = "gGrottoDL", pass = "translucent" }]

