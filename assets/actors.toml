[actors.ACTOR_FISHING]
name = "Fishing Pond"
notes = "The Fishing Pond: placed once, it is the pond's owner, and spawns everything else. Init moves the owner outright to (160, -2, 1208) and turns him to -0x6000; the turn is drawn, the position is not, so he is drawn where he is placed, and the aquarium, sign and fish are drawn from there at their offsets from where Init puts him, since the game draws them at fixed world positions. A child has hair; an adult his cap, or nothing once the fish has stolen it (HS_FISH_STOLE_HAT), which a scene does not say. The pond's reeds, lily pads, rocks and wooden posts, the schools of small fish, effects, rod and lure are drawn from the owner's Draw at world positions in tables and are not drawn. 15 fish are spawned as children, each at a random turn, drawn unturned; every fourth game a sixteenth (adult) or sixteenth and seventeenth (child), loaches, are spawned too, not drawn. A fish's size is its length, random about its table's base length, set in Update; drawn at the base length of the first fish (40) or loach (45). Fish and the aquarium fish are spawned, never placed."
object = "object_fish"
scale = 0.011
rotates = { x = false, y = false, z = false }

