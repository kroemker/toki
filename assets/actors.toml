# Toki's own actor database: how the vanilla actors of HackerOoT are shown.
# Every checkout is seeded from it; see docs/actor-database.md.
format = 2

[actors.ACTOR_PLAYER]
name = "Link"
notes = "The player, drawn at the entrance the Scene panel shows him at. Marked until his pose can be read: his animations are in link_animetion, which is not asset C, and at rest his limbs lie apart. The variants say what he will be drawn with."
draw = "marker"

[[actors.ACTOR_PLAYER.variants]]
match = { age = "adult" }
object = "object_link_boy"
parts = [{ skeleton = "gLinkAdultSkel", segments = { 8 = "gLinkAdultEyesOpenTex", 9 = "gLinkAdultMouthClosedTex" } }]

[[actors.ACTOR_PLAYER.variants]]
match = { age = "child" }
object = "object_link_child"
parts = [{ skeleton = "gLinkChildSkel", segments = { 8 = "gLinkChildSkel_gLinkChildEyesOpenTex_ci8_tlut_gLinkChildSkinTLUT_png_001_ci8", 9 = "gLinkChildSkel_gLinkChildMouthClosedTex_ci8_tlut_gLinkChildSkinTLUT_png_001_ci8" } }]

[actors.ACTOR_OBJ_TSUBO]
name = "Pot"
notes = "Breaks when cut, thrown or rolled into, and may drop a collectible. Killed if there is no floor under it."
object = "gameplay_dangeon_keep"
scale = 0.15

[actors.ACTOR_OBJ_TSUBO.params]
Drop = { mask = 0x001F, kind = "number", description = "The ITEM00 collectible it drops; ITEM00_MAX or more drops nothing" }
Type = { mask = 0x0100, kind = "choice", values = { 0 = "Dungeon", 1 = "Plain" }, description = "The dungeon keep's pot, or object_tsubo's" }
"Collectible Flag" = { mask = 0x7E00, kind = "number", description = "Set when its drop is collected, so it is not dropped again" }

[[actors.ACTOR_OBJ_TSUBO.variants]]
match = { Type = 0 }
parts = [{ display_list = "gPotDL" }]

[[actors.ACTOR_OBJ_TSUBO.variants]]
match = { Type = 1 }
object = "object_tsubo"
parts = [{ display_list = "object_tsubo_DL_0017C0" }]

[actors.ACTOR_EN_KUSA]
name = "Bush or grass"
notes = "A bush that is cut once, or a tuft of grass that is cut and grows back. Placed with rotation Y 0, it is given a random one. The stump after a cut is object_kusa_DL_0002E0."
scale = 0.4

[actors.ACTOR_EN_KUSA.params]
Type = { mask = 0x0003, kind = "choice", values = { 0 = "Bush", 1 = "Grass", 2 = "Grass Table" }, description = "A bush; grass that drops seeds or a heart by chance; grass that drops from its drop table" }
Bugs = { mask = 0x0010, kind = "flag", description = "Spawns bugs when cut" }
Drop = { mask = 0x0F00, kind = "number", description = "The drop table of a bush or grass_table; 13 and up are table 0" }

[[actors.ACTOR_EN_KUSA.variants]]
match = { Type = 0 }
object = "gameplay_field_keep"
parts = [{ display_list = "gFieldBushDL" }]

[[actors.ACTOR_EN_KUSA.variants]]
object = "object_kusa"
parts = [{ display_list = "object_kusa_DL_000140" }]

[actors.ACTOR_OBJ_MURE2]
name = "Ring of bushes or rocks"
notes = "Spawns bushes or rocks in a ring or a scatter around itself when Link comes near. Children get the parent's drop table in their bits 8 to 11, which a variant's fixed child params cannot follow; it does not change how they look. The offsets are world axes: the ring is not turned with the actor."
rotates = { x = false, y = false, z = false }
draw = "children"

[actors.ACTOR_OBJ_MURE2.params]
Type = { mask = 0x0003, kind = "choice", values = { 0 = "Bush Ring", 1 = "Bush Scatter", 2 = "Rock Ring" } }
Drop = { mask = 0x0F00, kind = "number", description = "The drop table its bushes or rocks get; 13 and up are table 0" }

