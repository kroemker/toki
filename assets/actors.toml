[actors.ACTOR_ELF_MSG]
name = "Navi message spot"
notes = "Where Navi flies to and speaks when Link enters: a cylinder, or a box with Shape set, sized by its rotation X (width) and Z (height), each times 4 units, 40 when zero. Drawn only in debug builds while a debug register is set; a marker here."
draw = "marker"
rotates = { x = false, y = false, z = false }

[actors.ACTOR_ELF_MSG.params]
Message = { mask = 0x00FF, kind = "number", hex = true, description = "Navi's message, plus 0x100" }
"Switch Flag" = { mask = 0x3F00, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set when Navi speaks; gone while set. 0x3F is none" }
Shape = { mask = 0x4000, kind = "choice", values = { 0 = "Cylinder", 1 = "Box" } }
Optional = { mask = 0x8000, kind = "flag", description = "Navi only calls for C-up; clear, Link is made to talk to her" }
Width = { mask = 0xFFFF, source = "rotation_x", kind = "number", description = "Radius or half width, times 4 units; 0 is 40" }
Condition = { mask = 0xFFFF, source = "rotation_y", kind = "number", signed = true, description = "1 to 0x40: gone once switch flag (this - 1) is set; -1: gone once the room is clear; 0x42 to 0x80: active only while switch flag (this - 0x41) is set" }
Height = { mask = 0xFFFF, source = "rotation_z", kind = "number", description = "Times 4 units; 0 is 40" }
