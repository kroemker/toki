[actors.ACTOR_BOSS_FD]
name = "Volvagia"
notes = "The Fire Temple's boss, a flying dragon. Init moves it to (0, -200, 0) whatever its placement, and every part is drawn at world positions from a 100-entry trail of where its head has been, so in the game nothing is drawn at the placement; here it is drawn at its placement flying straight ahead (+Z) at speed 8, as in its ceiling and rock-dropping passes: head at the front, both arms behind it and the body trailing back. The game draws the 18 body segments one by one, each at its trail point, loading the previous segment's matrix from segment 13 to stitch them; that is drawn here with the object's own gVolvagiaBodySkel and gVolvagiaBodyStaticAnim, which the code never uses but which lays the same segments out 800 apart, as speed 8 does. The arms' first limbs are turned 4000 more about Y (OverrideLimbDraw), which is not expressed. Its body texture scrolls through Gfx_TwoTexScroll on segment 8, drawn at its first frame with tile 0 at Y 120 as Update keeps it; the body's second texture blends by env alpha, pulsing 30 to 158 (drawn at 158), the head's 0 to 255 (drawn at 255); eyes open (they blink). Not drawn: the three fire manes (gVolvagiaManeModelDL strips along the trail, translucent), the jaw opening, its broken face and its skull and jawbone once its skin has burnt off, the ribs left as segments burn, embers, debris, dust, fire breath and falling rocks (En_Vb_Ball), and the damage fog flash. While waiting for the intro nothing is drawn. Init sets switch flag 0x14, spawns the rising platform (Bg_Vb_Sima, params 100) at (680, -100, 0) and, unless the room is clear, Boss_Fd2 (Volvagia's head popping out of the lava holes) at (0, -200, 0); none are children here. Once the room is clear it is gone and spawns the blue warp at (0, 100, 0) and a Heart Container at (0, 100, 200). Params are not read."
object = "object_fd"
scale = 0.05

