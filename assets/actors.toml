[actors.ACTOR_BOSS_GANONDROF]
name = "Phantom Ganon"
notes = "The Forest Temple's boss, riding his phantom horse (En_fHG, spawned as his child at his own position with his params). He is drawn in the ride pose of his intro with his mask off, his head swapped for gPhantomGanonFaceDL; his eyes' env colour starts at 0 and brightens during the fight. In the game he rides wherever the horse is: the horse's Init moves it to the room's centre at Y -300 whatever the placement, which is not drawn, so both are drawn at the placement. Params under 10 are the real boss (Init sets them to 1); 10 to 15 are the fake that the horse spawns in another painting, 10 plus its painting. Once the room is clear he is gone and spawns the blue warp at (14, -33, -3315) and a heart container at (214, -33, -3315), which are not drawn. The paintings are the room's own geometry, not actors."
object = "object_gnd"
scale = 0.01

[actors.ACTOR_BOSS_GANONDROF.params]
Type = { mask = 0xFFFF, kind = "number", signed = true, description = "Under 10 is the real boss; 10 to 15 a fake, in painting Type - 10, spawned by the horse" }

[[actors.ACTOR_BOSS_GANONDROF.variants]]
match = { Type = [10, 11, 12, 13, 14, 15] }
parts = [{ skeleton = "gPhantomGanonSkel", pose = "gPhantomGanonRideAnim", env = [0, 0, 0, 0] }]
children = [{ actor = "ACTOR_EN_FHG", params = 0x0000, take = { Type = "Type" }, offset = [0, 0, 0] }]

[[actors.ACTOR_BOSS_GANONDROF.variants]]
parts = [{ skeleton = "gPhantomGanonSkel", pose = "gPhantomGanonRidePoseAnim", limbs = { 15 = "gPhantomGanonFaceDL" }, env = [0, 0, 0, 0] }]
children = [{ actor = "ACTOR_EN_FHG", params = 0x0000, take = { Type = "Type" }, offset = [0, 0, 0] }]
default_params = 0xFFFF

[actors.ACTOR_EN_FHG]
name = "Phantom Ganon's horse"
notes = "The phantom horse Phantom Ganon rides, spawned by him with his params; it rides out of the paintings in his first phase and spawns the fake Phantom Ganon. Marked: its skeleton is a skin (Skin_Init, drawn by func_800A6330), which Toki does not draw yet; the variants say what it will be drawn with. The real boss's horse stands in its idle animation and Init moves it to the room's centre at Y -300 whatever its placement; a fake's gallops out of painting Type - 10. Init sets switch flag 0x14."
object = "object_fhg"
scale = 0.0115
height_offset = -2600
draw = "marker"

[actors.ACTOR_EN_FHG.params]
Type = { mask = 0xFFFF, kind = "number", signed = true, description = "1 is the real boss's horse; 10 to 15 a fake's, in painting Type - 10" }

[[actors.ACTOR_EN_FHG.variants]]
match = { Type = [10, 11, 12, 13, 14, 15] }
parts = [{ skeleton = "gPhantomHorseSkel", pose = "gPhantomHorseRunningAnim" }]

[[actors.ACTOR_EN_FHG.variants]]
parts = [{ skeleton = "gPhantomHorseSkel", pose = "gPhantomHorseIdleAnim" }]
default_params = 0x0001

[actors.ACTOR_EN_RIVER_SOUND]
name = "Ambient sound source"
notes = "An invisible source of an ambient sound: rivers, waterfalls, lava, crowds, Saria's Song in the Lost Woods and Goron City, and more. Its Draw only plays the sound, so it is a marker. A river sound slides along its path to the point nearest Link. Types 0xF7 and up set the nature ambience or Ganon's Tower music volume and remove themselves; Lost Woods Saria's Song is gone unless Link has Zelda's Lullaby and not Saria's Song."
draw = "marker"
scale = 0.01

[actors.ACTOR_EN_RIVER_SOUND.params]
Sound = { mask = 0x00FF, kind = "choice", values = "RiverSoundType" }
Path = { mask = 0xFF00, kind = "number", description = "The scene path a river sound follows; only the three river types read it" }

[actors.ACTOR_EN_WONDER_ITEM]
name = "Invisible collectible trigger"
notes = "An invisible spot that drops an item or sets a switch flag when Link touches it, hits it, or walks a set of tag points: MQ's cow switches and the like. Draws nothing (no Draw function; debug builds show it in the debug display), so it is a marker. Gone once its switch flag is set. Tag points (modes 1 and 6) register their position and remove themselves at once."
draw = "marker"
scale = 0.01
rotates = { x = true, y = true, z = false }

[actors.ACTOR_EN_WONDER_ITEM.params]
"Switch Flag" = { mask = 0x003F, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set when triggered; gone while set. 0x3F is none" }
Drop = { mask = 0x07C0, kind = "choice", values = "EnWonderItemDrop", description = "The item dropped; 12 and up drop from random drop table (this - 12)" }
Mode = { mask = 0xF800, kind = "choice", values = "EnWonderItemMode" }
"Count or Index" = { mask = 0xFFFF, source = "rotation_z", kind = "number", description = "Multitag: tag points (ones digit) and time limit (tens, in seconds); tag point: its index; drop modes: how many drop; interact switch: what hits it (0 sword or stick, 1 arrow, 2 hammer, 3 explosive, 4 slingshot, 5 boomerang, 6 hookshot)" }

[actors.ACTOR_EN_WONDER_TALK2]
name = "Invisible message spot"
notes = "An invisible spot that shows message 0x200 plus Message when Link talks to it or walks near it. Draws nothing (no Draw function; debug builds show it in the debug display), so it is a marker. Gone once its switch flag is set. Talking needs Link within 40 plus the range of it, in front of it (its Y rotation is the way it faces). In the Gerudo Training Ground, forced spots other than switch flags 0x08, 0x16 and 0x2F only speak once and do not set their flag."
draw = "marker"
scale = 0.01
rotates = { x = true, y = true, z = false }

[actors.ACTOR_EN_WONDER_TALK2.params]
"Switch Flag" = { mask = 0x003F, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set once read (not with Check Only); gone while set. 0x3F is none" }
Message = { mask = 0x3FC0, kind = "number", hex = true, offset = 0x200, description = "The message shown, plus 0x200" }
Mode = { mask = 0xC000, kind = "choice", values = { 0 = "Talk", 1 = "Speaks when Link is near", 2 = "Check only, sets no flag", 3 = "Lock-on only" } }
Range = { mask = 0xFFFF, source = "rotation_z", kind = "number", description = "Ones digit: trigger range in 40 units; tens digit: the lock-on range type (0 to 6)" }

[actors.ACTOR_EN_OKARINA_TAG]
name = "Ocarina spot"
notes = "An invisible spot where playing a song does something: sets a switch flag, opens the Door of Time, speeds up the windmill, opens the royal tomb, or (type 5) the Sun's Song engraving in the royal tomb. Draws nothing (no Draw function; debug builds show it in the debug display), so it is a marker. Gone once its switch flag is set. Song of Storms (type 2) is gone for adult Link; the Door of Time and royal tomb spots stop once their events are done. The scarecrow's song only works once it has been set. Other types remove themselves."
draw = "marker"
scale = 0.01
rotates = { x = true, y = true, z = false }

[actors.ACTOR_EN_OKARINA_TAG.params]
"Switch Flag" = { mask = 0x003F, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set when the song is played; gone while set. 0x3F is none" }
Song = { mask = 0x03C0, kind = "choice", values = { 0 = "Saria's Song", 1 = "Epona's Song", 2 = "Zelda's Lullaby", 3 = "Sun's Song", 4 = "Song of Time", 5 = "Song of Storms", 6 = "Scarecrow's Song", 15 = "Any song" }, description = "The song a Type 7 spot checks for" }
Type = { mask = 0xFC00, kind = "choice", values = { 1 = "Zelda's Lullaby event", 2 = "Windmill (Song of Storms)", 4 = "Door of Time (Song of Time)", 5 = "Sun's Song engraving", 6 = "Royal tomb (Zelda's Lullaby)", 7 = "Song check" } }
Range = { mask = 0xFFFF, source = "rotation_z", kind = "number", description = "Added range, times 40 units" }

[actors.ACTOR_SHOT_SUN]
name = "Sun target or song fairy spot"
notes = "Either the spot in Lake Hylia where shooting an arrow into the rising sun (6:30 to 7:30) gives the Fire Arrows, spawned at a fixed world position (700, -800, 7261), or a large magic jar once they are had; or a spot where playing the Sun's Song or Song of Storms spawns a great healing fairy with sparkles. Draws nothing, so it is a marker; the fairy and sparkles are spawned only once the song is played."
draw = "marker"
scale = 0.01

[actors.ACTOR_SHOT_SUN.params]
Type = { mask = 0x00FF, kind = "choice", values = { 0 = "Lake Hylia sun", 64 = "Sun's Song fairy", 65 = "Song of Storms fairy" }, description = "Any value but 0x40 and 0x41 is the Lake Hylia sun" }

[actors.ACTOR_EN_WEATHER_TAG]
name = "Weather zone"
notes = "Changes the weather and the sky while Link is within Range of it: clouds over the market, ranch or Death Mountain, snow in Zora's Domain, rain at Lake Hylia, thunderstorms in Kakariko and the graveyard, the desert's sandstorm. Draws nothing, so it is a marker. Each type is gone once its story event is done (Epona, the Water or Fire Temple, the Shadow Medallion)."
draw = "marker"
scale = 0.01

[actors.ACTOR_EN_WEATHER_TAG.params]
Type = { mask = 0x000F, kind = "choice", values = "EnWeatherTagType" }
Range = { mask = 0xFF00, kind = "number", description = "Radius, times 100 units" }

[actors.ACTOR_DEMO_KANKYO]
name = "Cutscene environment effect"
notes = "Effects of cutscenes: the Door of Time and the light behind it, the rocks of the Hyrule Castle escape cutscene, rain, clouds, and the sparkles of warping songs and great fairies. The Door of Time is gone once it has been opened, and spawns Door_Toki, its collision; while open its halves slide apart, drawn closed here. The light plane is drawn when no cutscene plays; its texture scrolls, drawn at its first frame. Rocks are placed by cutscene cues and turned by them, drawn at their placement unturned at the middle of their random 0.5 to 1 scale. Rain, clouds and sparkles are drawn around the camera or at runtime positions and are markers. Types 8 to 12 load object_gi_melody but draw nothing."
draw = "marker"
scale = 1.0

[actors.ACTOR_DEMO_KANKYO.params]
Type = { mask = 0xFFFF, kind = "choice", values = "DemoKankyoType" }

