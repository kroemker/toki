notes = "The Shadow Temple's boss: a head (Type -1, the one placed) and its two hands (Types 0 and 1), which the head spawns at (200, 0, 400) and (-200, 0, 400) from itself, and the drum floor (Bg_Sst_Floor, BONGOFLOOR_REST) at the room's centre, (-50, 0, 0) in the world. Init moves the head to (0, 0, -650) whatever its placement, with its rotation's Y at 0, and lifts its model by shape.yOffset 70000 (1400 units); drawn here at the placement with that offset, and its children at their offsets from it, though in the game the hands drop to the floor. The head is drawn opaque, eyes closed in gBongoHeadEyeCloseIdleAnim, its idle once the fight has begun; in the fight it is invisible unless seen through the Lens of Truth, which draws it translucent with segment 8 at the start of D_80116280 instead, and it is visible opaque only while stunned. The hands stand in their idle animations, their root pulled back by 3500 (handZPosMod), with segment 8 at &D_80116280[2]. Every part takes the primitive colour white with an LOD fraction of 0x80, which cannot be written. Not drawn: the hand trails while they strike, the vanish mask of the intro, the shadows, shockwaves and ice. The head is invisible until Link drops within 1000 units of it. Once the room is clear the head is gone and spawns the blue warp at (-50, 0, 400) and a heart container at (-50, 0, -200); Init sets switch flag 0x14."
