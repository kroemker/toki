height_offset = -500
parts = [{ skeleton = "gWolfosWhiteSkel", pose = "gWolfosRearingUpFallingOverAnim", segments = { 8 = "gWolfosWhiteEyeOpenTex" } }]

[actors.ACTOR_EN_TEST]
name = "Stalfos"
notes = "A sword-and-shield skeleton. One on the ground rises out of it when Link comes within 150 units in height, unseen until then (its height scale starts at 0), 3.5 units below its placement as Init puts it. One from the ceiling waits unseen 150 units above its placement and drops when Link comes near; it is drawn at its placement, where it lands. An invisible one is seen only through the Lens of Truth; it is drawn as seen. Its head glows by an environment colour set at the head limb, pulsing from dark red; the whole skeleton is drawn with it at its first frame. Drawn in gStalfosMiddleGuardAnim, the animation its setup at Init plays. All but type 2 start the miniboss music when they rise. Types 4 and 5 are set by its death code and differ only in how it falls apart and reassembles."
object = "object_sk2"
scale = 0.015
height_offset = -233.333

[actors.ACTOR_EN_TEST.params]
Type = { mask = 0xFFFF, kind = "choice", values = { 0 = "Invisible", 1 = "Rises from the ground", 2 = "Rises from the ground, no miniboss music", 3 = "Drops from the ceiling", 4 = "Type 4", 5 = "Type 5", 65535 = "Rises from the ground (-1)" } }

[[actors.ACTOR_EN_TEST.variants]]
