[actors.ACTOR_EN_DNT_NOMAL]
name = "Deku Scrub (target game, mask contest)"
notes = "Two scrubs by params. A target scrub (0, or any negative params, as the vanilla -1 placed in the Lost Woods) uses object_hintnuts and waits in its flower for the slingshot target game, turned to face Link at Init; drawn as it waits, gHintNutsBurrowAnim held at frame 8. Its skeleton is a flex skeleton drawn as a standard one (a bug of the game). An audience scrub of the mask contest (1 to 9, spawned by En_Dnt_Demo) uses object_dnk and waits hidden, gDntStageHideAnim held at frame 8, eyes open; its leaves and flower are tinted by sLeafColors[params - 1], set before limbs 1 and 3 to 6 and kept for the rest. Each is drawn on its flower, placed where the scrub first lands (its position here) and drawn unturned in the game. Their dances, the dust as they celebrate, and the nuts they spit are not drawn. The object each needs must be loaded in the room or the scrub is killed; params above 9 read past sLeafColors."
