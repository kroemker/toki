notes = "Adult Zelda at the top of Ganon's Tower and in the escape from its collapse. Her hair hangs from her head (limb 14) on seven matrices OverrideLimbDraw computes into segment 12, swinging as her head turns; drawn hanging as modelled, the swing at rest. Type 0 is freed from her crystal after Ganondorf; type 1 follows the cutscene before the collapse; type 3 is the escape, one per stretch of the tower, shown where Link reaches her (Switch Flag) and running along the waypoints of her path; she opens the barred gates (Bg_Zg) by their switch flags as she goes. She is posed from object_zl2_anime2. Other types are killed. Drawn in gZelda2Anime2Anim_008AD0, the first animation her actions give her, eyes open; segment 11 is pointed at &D_80116280[2] as when she is opaque, and her translucent fades are not drawn. Her torso turning toward Link (limb 7) is not drawn."
object = "object_zl2"
scale = 0.01

[actors.ACTOR_EN_ZL3.params]
Type = { mask = 0x000F, kind = "choice", values = { 0 = "Tower top, after Ganondorf", 1 = "Before the collapse", 3 = "Escape" } }
Waypoint = { mask = 0x00F0, kind = "number", description = "The point of her path she starts from, in the escape" }
"Switch Flag" = { mask = 0xFF00, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set as she leaves this stretch of the escape" }

[[actors.ACTOR_EN_ZL3.variants]]
parts = [{ skeleton = "gZelda2Skel", pose = "gZelda2Anime2Anim_008AD0", pose_object = "object_zl2_anime2", env = [0, 0, 0, 255], segments = { 8 = "gZelda2EyeOpenTex", 9 = "gZelda2EyeOpenTex", 10 = "gZelda2MouthSeriousTex", 11 = { code = "D_80116280", index = 2 }, 12 = { matrices = [{ translation = [174, -317, 0] }, { translation = [-236, -501, 0] }, { translation = [-1255, -527, 0] }, { translation = [40, 264, 386] }, { translation = [-406, 212, 470] }, { translation = [40, 264, -386] }, { translation = [-406, 212, -470] }], limb = 14 } } }]
