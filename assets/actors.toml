# The actor database shipped with Toki: how the vanilla actors of HackerOoT are
# drawn. Written by Toki; see docs/actor-database.md.
format = 1

[actors.ACTOR_PLAYER]
status = "checked"
name = "Link"
description = "The player, drawn at the entrance the Scene panel shows him at."
notes = "Marked until his pose can be read: his animations are in link_animetion, which is not asset C, and at rest his limbs lie apart. The variants say what he will be drawn with."
draw = "marker"

[[actors.ACTOR_PLAYER.variants]]
match = { age = "adult" }
object = "object_link_boy"
skeleton = "gLinkAdultSkel"
segments = { 8 = "gLinkAdultEyesOpenTex", 9 = "gLinkAdultMouthClosedTex" }

[[actors.ACTOR_PLAYER.variants]]
match = { age = "child" }
object = "object_link_child"
skeleton = "gLinkChildSkel"
segments = { 8 = "gLinkChildSkel_gLinkChildEyesOpenTex_ci8_tlut_gLinkChildSkinTLUT_png_001_ci8", 9 = "gLinkChildSkel_gLinkChildMouthClosedTex_ci8_tlut_gLinkChildSkinTLUT_png_001_ci8" }

# Obj_Tsubo
[actors.ACTOR_OBJ_TSUBO]
status = "checked"
name = "Pot"
description = "Breaks when cut, thrown or rolled into, and may drop a collectible."
notes = "Killed if there is no floor under it."
object = "gameplay_dangeon_keep"
scale = 0.15

[actors.ACTOR_OBJ_TSUBO.fields]
drop        = { kind = "integer", shift = 0, width = 5, role = "item", meaning = "The ITEM00 collectible it drops; ITEM00_MAX or more drops nothing" }
type        = { kind = "enum", shift = 8, width = 1, values = { dungeon = 0, plain = 1 }, meaning = "The dungeon keep's pot, or object_tsubo's" }
collectible = { kind = "integer", shift = 9, width = 6, role = "collectible_flag", meaning = "Set when its drop is collected, so it is not dropped again" }

[[actors.ACTOR_OBJ_TSUBO.variants]]
match = { type = "dungeon" }
display_lists = [{ name = "gPotDL" }]

[[actors.ACTOR_OBJ_TSUBO.variants]]
match = { type = "plain" }
object = "object_tsubo"
display_lists = [{ name = "object_tsubo_DL_0017C0" }]

# En_Kusa
[actors.ACTOR_EN_KUSA]
status = "checked"
name = "Bush or grass"
description = "A bush that is cut once, or a tuft of grass that is cut and grows back."
notes = "Placed with rotation Y 0, it is given a random one. The stump after a cut is object_kusa_DL_0002E0."
scale = 0.4

[actors.ACTOR_EN_KUSA.fields]
type = { kind = "enum", shift = 0, width = 2, values = { bush = 0, grass = 1, grass_table = 2 }, meaning = "A bush; grass that drops seeds or a heart by chance; grass that drops from its drop table" }
bugs = { kind = "flag", shift = 4, meaning = "Spawns bugs when cut" }
drop = { kind = "integer", shift = 8, width = 4, meaning = "The drop table of a bush or grass_table; 13 and up are table 0" }

[[actors.ACTOR_EN_KUSA.variants]]
match = { type = "bush" }
object = "gameplay_field_keep"
display_lists = [{ name = "gFieldBushDL" }]

[[actors.ACTOR_EN_KUSA.variants]]
object = "object_kusa"
display_lists = [{ name = "object_kusa_DL_000140" }]

# Obj_Mure2
[actors.ACTOR_OBJ_MURE2]
status = "checked"
name = "Ring of bushes or rocks"
description = "Spawns bushes or rocks in a ring or a scatter around itself when Link comes near."
notes = "Children get the parent's drop table in their bits 8 to 11, which a variant's fixed child params cannot follow; it does not change how they look. The offsets are world axes: the ring is not turned with the actor."
