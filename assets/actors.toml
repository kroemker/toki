notes = "Child Zelda in Hyrule Castle's courtyard: she waits looking in the window until Link speaks to her, then plays the meeting cutscene, gives him her letter and stays standing once EVENTCHKINF_40 is set; on the cutscene layer she plays the ending's courtyard scene. Drawn as she first waits, looking in the window (ZL4_ANIM_21, gChildZeldaAnim_019600), eyes open and mouth neutral; after the meeting and in cutscenes she stands in gChildZeldaAnim_000654 instead, which the format cannot pick by flag or layer. Limbs 3 to 6 are hidden by OverrideLimbDraw. Her head and torso turn toward Link as she talks; not drawn. Her eyes blink and her face changes through the cutscene; drawn open."
object = "object_zl4"
scale = 0.01

[[actors.ACTOR_EN_ZL4.variants]]
parts = [{ skeleton = "gChildZeldaSkel", pose = "gChildZeldaAnim_019600", limbs = { 3 = false, 4 = false, 5 = false, 6 = false }, segments = { 8 = "gChildZeldaEyeOpenTex", 9 = "gChildZeldaEyeOpenTex", 10 = "gChildZeldaMouthNeutralTex" } }]

[actors.ACTOR_EN_CS]
name = "Graveyard kid"
notes = "The boy of the Kakariko Graveyard who walks a path swinging a stick, and buys the Spooky Mask. He is killed at night (IS_DAY false at Init). Drawn walking at the first frame of gGraveyardKidWalkAnim, eyes open. Once he has bought the Spooky Mask (ITEMGETINF_3A) he wears it, gLinkChildSpookyMaskDL from object_link_child drawn at a matrix PostLimbDraw takes at his head (limb 15) with segment 13 pointed seven matrices before it, which the format cannot say; not drawn. His head and torso turn toward Link as he talks; not drawn."
