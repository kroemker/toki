[actors.ACTOR_EN_BLKOBJ]
name = "Illusion room (Dark Link)"
notes = "The misty lake room of the Water Temple where Dark Link appears: until the room's clear flag is set, the illusion model is drawn, and once Dark Link is beaten the plain room fades in over 100+ frames and the illusion fades out. Drawn here as before the fight, the illusion alone at full alpha, translucent with segment 8 pointed at the overlay's sSetupOpaDL, which sets an opaque render mode. With the clear flag set the room is gIllusionRoomNormalDL instead, which a scene does not say. Both lists also call segment 13, which Draw points at a Gfx_TwoTexScroll of two 32x32 tiles scrolling with the frame count; the format has no segment 13, so it is left unset. Spawns Dark Link (En_Torch2) at its position when Link comes within 120 units, at run time. Params are not read."
object = "object_blkobj"
scale = 1

