scale = 1

[actors.ACTOR_OBJ_SYOKUDAI.params]
"Switch Flag" = { mask = 0x003F, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set when it is lit, or lights it when set" }
Count = { mask = 0x03C0, kind = "number", description = "How many torches must be lit together; a timed torch burns 50 frames longer for each" }
Lit = { mask = 0x0400, kind = "flag", description = "Lit from the start" }
Type = { mask = 0xF000, kind = "choice", values = { 0 = "Golden", 1 = "Timed", 2 = "Wooden" } }

