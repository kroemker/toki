notes = "The final boss, in the collapsed tower's arena: Ganondorf, who bursts out of the rubble and turns into Ganon. Drawn as Ganon once the fight starts (gGanonSkel from object_ganon2), standing in gGanonGuardIdleAnim with his eyes open (gGanonEyeOpenTex on segment 8; he blinks). His tail limbs (42 to 46) take an environment colour that pulses between 127 and 255 grey, written at its first frame, 191, on the whole skeleton since only the tail reads it; while hit it is red, and a red fog flashes. His swords and horns are hidden by OverrideLimbDraw and drawn again by PostLimbDraw at a scale that grows in the cutscene and is 1 in the fight, so they are drawn as the skeleton has them. Before the transformation he is Ganondorf (gGanondorfSkel of object_ganon, posed from object_ganon_anime3, eyes empty), not drawn here. Init moves him to Y -3000 until the cutscene starts, and the cutscene places him outright; drawn at the placement. Not drawn: his shadow texture, Zelda (En_Zl3, spawned as his child at the fixed world position 970, 1086, -214), the Master Sword, Triforce, lightning, fire ring and Zelda's light magic the overlay draws itself (gGanonMasterSwordDL and others), the light orbs at his limbs, and every effect. His params are not read."
