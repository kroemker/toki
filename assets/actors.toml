[actors.ACTOR_DOOR_WARP1]
name = "Blue warp or warp crystal"
notes = "The blue warp out of a dungeon after its boss, its coloured cutscene copies, and the crystals that close around Link: the blue one after taking a warp, the purple one in the Temple of Time. A warp is gWarpPortalDL drawn twice, the portal and its light ray, each loading two matrices Draw builds in world space: segment 10 at the actor's position, 1 up, and segment 9 raised and widened by the warp's state; it is drawn as it settles once shown, unturned and unscaled, at full alpha, its scroll at the first frame. It fades in as it appears. The coloured copies (yellow, orange, green, red) settle smaller, and take their colour from the type. The adult dungeon warp draws the blue crystal too, but at alpha 0 until Link steps in, so only its portal shows. The crystals are drawn at full alpha, held at the last frame of gWarpCrystalAnim as their setup holds it; each fades in during its cutscene. The purple crystal lights itself from an eye that circles with the frame count (func_8002EB44), drawn here with the hilite from the camera; at the Temple of Time's first entrance it shrinks from scale 1 to the size drawn here. A Destination warp exists only when arriving by a warp, and fades out after 80 frames."
