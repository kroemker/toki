[actors.ACTOR_ELF_MSG2]
name = "Navi check spot"
notes = "A spot Link targets and checks with C-up to hear a message from Navi. Drawn only in debug builds while a debug register is set, as the overlay's own sCubeDL in a translucent blue; a marker here. Gone once its switch flag is set; Rotation Y can also make it wait for a switch flag, or vanish with another flag or the room's clear flag."
draw = "marker"
scale = 0.2
rotates = { x = false, y = false, z = false }

[actors.ACTOR_ELF_MSG2.params]
Message = { mask = 0x00FF, kind = "number", hex = true, description = "Navi's message, plus 0x100" }
"Switch Flag" = { mask = 0x3F00, kind = "number", scene_flag = "switch", flag_use = "both", description = "Set once the message is read; gone while set. 0x3F is none" }
"Target Range" = { mask = 0xFFFF, source = "rotation_x", kind = "number", description = "1 to 7: its attention range type, plus one; other values keep the default" }
Condition = { mask = 0xFFFF, source = "rotation_y", kind = "number", signed = true, description = "1 to 0x40: gone once switch flag (this - 1) is set; -1: gone once the room is clear; 0x41 to 0x80: checkable only once switch flag (this - 0x41) is set" }
Repeat = { mask = 0xFFFF, source = "rotation_z", kind = "number", description = "1: stays after it is read; anything else: gone once read" }

[actors.ACTOR_EN_LIGHT]
name = "Flame"
notes = "A free-standing flame that lights its surroundings, as on the torches of Ganon's Castle, the Shadow Temple and the fairy fountains; with Candle set, the small flame of a candle, without its sound. Its colour and size come from the table D_80A9E840 by Color; a candle keeps its own colours but takes the size. The game turns it to face the camera about Y only, and scrolls its texture from a random frame; drawn here facing the camera at the scroll's start. A switched flame shrinks away while its switch flag says off: one with Lit While Set is unseen until the flag is set, which is not drawn: every flame is drawn lit."
object = "gameplay_keep"
scale = 0.0075

[actors.ACTOR_EN_LIGHT.params]
