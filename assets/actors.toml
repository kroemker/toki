[actors.ACTOR_ITEM_ETCETERA]
name = "Item"
notes = "A get-item model lying in the world, collected by touch: Ruto's letter, the Lake Hylia fire arrow, the Zora diving game's scale, and the Treasure Box Shop's prizes. The fire arrow appears only once Link shoots the sun; the shop's prizes are drawn only through the Lens of Truth. Drawn by GetItem_Draw, as sDrawItemIndices picks. The shop's prizes are raised 15 units, drawn here as a height offset at their scale."
