notes = "A big spider hanging from a thread, which drops to the floor when Link comes near and climbs back when he leaves; the thread is not drawn by this actor. Drawn in object_st_Anim_000304, the animation Init gives it. Its teeth are coloured by an environment colour set at limb 4, black at rest and flashing red while it waits on the floor; the whole skeleton is drawn with it here. An invisible one is seen only through the Lens of Truth; it is drawn as seen."
object = "object_st"
scale = 0.04

[actors.ACTOR_EN_ST.params]
Type = { mask = 0xFFFF, kind = "choice", values = { 0 = "Skulltula", 1 = "Big Skulltula", 2 = "Invisible Skulltula" } }

[[actors.ACTOR_EN_ST.variants]]
parts = [{ skeleton = "object_st_Skel_005298", pose = "object_st_Anim_000304", env = [0, 0, 0, 0] }]

[[actors.ACTOR_EN_ST.adjustments]]
match = { Type = 1 }
scale = 0.056

[actors.ACTOR_EN_DEKUBABA]
name = "Deku Baba"
notes = "A carnivorous plant, drawn as it waits: its head pointing up out of its leaves on a retracted stem, until Link comes near and it rises. SetupWait turns the head up and raises it 14 units, times its size, above its placement; the stem is drawn 6 units below. A big one is two and a half times the size. Its shadow is not drawn. When killed it may leave a Deku Stick, drawn by itself."
object = "object_dekubaba"
scale = 0.005

[actors.ACTOR_EN_DEKUBABA.params]
Type = { mask = 0xFFFF, kind = "choice", values = "DekuBabaType" }

[[actors.ACTOR_EN_DEKUBABA.variants]]
parts = [
    { skeleton = "gDekuBabaSkel", pose = "gDekuBabaFastChompAnim", translation = [0, 2800, 0], rotation = [-90, 0, 0] },
    { display_list = "gDekuBabaStemTopDL", translation = [0, -1200, 0], rotation = [-90, 0, 0], scale = 2 },
    { display_list = "gDekuBabaBaseLeavesDL", scale = 2 },
]

[[actors.ACTOR_EN_DEKUBABA.adjustments]]
match = { Type = 1 }
scale = 0.0125

[actors.ACTOR_EN_WF]
name = "Wolfos"
notes = "A wolf that rises out of the ground when Link comes within 240 units, unseen until then (its height scale starts at 0). Drawn in the first frame of gWolfosRearingUpFallingOverAnim, which SetupWaitToAppear starts it in, 5 units below its placement as Init puts it. Its eyes blink through segment 8, drawn open. A White Wolfos is bigger and stronger; one with a switch flag plays the miniboss music. Gone while its switch flag is set, which it sets when it dies."
object = "object_wf"

[actors.ACTOR_EN_WF.params]
Type = { mask = 0x00FF, kind = "choice", values = "EnWfType", description = "Anything but 0 is a White Wolfos" }
"Switch Flag" = { mask = 0xFF00, kind = "number", scene_flag = "switch", flag_use = "both", description = "0xFF is none" }

[[actors.ACTOR_EN_WF.variants]]
