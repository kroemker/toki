[actors.ACTOR_EN_BOX]
name = "Treasure chest"
notes = "A chest holding an item; small, large, or decorated for the boss key. Child Link opens it with gTreasureChestAnim_000128; frame 0 of either is closed. Types 4 and 6 are seen only through the Lens of Truth, drawn here as always seen. Switch, room-clear and falling types appear only when their condition holds."
object = "object_box"
scale = 0.01
rotates = { x = true, y = true, z = false }

[actors.ACTOR_EN_BOX.params]
"Chest Flag" = { mask = 0x001F, kind = "number", description = "Set once it is opened" }
Item = { mask = 0x0FE0, kind = "number", description = "The GI item it gives" }
Type = { mask = 0xF000, kind = "choice", values = { 0 = "Big", 1 = "Big, appears on room clear", 2 = "Boss Key", 3 = "Big, falls on switch", 4 = "Big, seen through the Lens", 5 = "Small", 6 = "Small, seen through the Lens", 7 = "Small, appears on room clear", 8 = "Small, falls on switch", 9 = "Big, appears to Zelda's Lullaby", 10 = "Big, appears to the Sun's Song", 11 = "Big, appears on switch" } }
"Switch Flag" = { mask = 0x003F, kind = "number", source = "rotation_z", description = "The switch that makes a switch or falling chest appear" }

[[actors.ACTOR_EN_BOX.variants]]
match = { Type = 2 }
parts = [
    { display_list = "gTreasureChestBossKeyChestFrontDL", rotation = [0, 180, 0], env = [0, 0, 0, 255] },
    { display_list = "gTreasureChestBossKeyChestSideAndTopDL", translation = [0, 2733, -1982], rotation = [180, 270, 0], env = [0, 0, 0, 255] },
]

[[actors.ACTOR_EN_BOX.variants]]
