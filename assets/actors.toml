notes = "A stone that tells a hint when read with the Mask of Truth, and gives a fairy when a song is played to it. Draw calls three lists that share state: gGossipStoneMaterialDL loads the texture and combiner, gGossipStoneDL loads the vertices and draws, and gGossipStoneSquishedDL draws more triangles from the vertices already loaded; they are written as three parts in that order, which is drawn right only while the texture and vertex buffer carry from one part to the next; if they do not, drop the first and last part. Its spin, squash and colour flash when hit, and the flame drawn above it after a song (gEffFire1DL), are runtime states and not drawn."
