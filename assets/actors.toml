[actors.ACTOR_EN_KAREBABA]
name = "Withered Deku Baba"
notes = "A Deku Baba that lies withered in its leaves until Link comes close, then rises to bite. Drawn as it waits (EnKarebaba_SetupIdle): its head pitched down at half scale 14 units above its leaves, its stem hanging from the head in three sections, under the ground until it rises. Params 0 makes it grow out of the ground first."
object = "object_dekubaba"
scale = 0.01
height_offset = 1400
rotates = { x = false, y = true, z = false }

[[actors.ACTOR_EN_KAREBABA.variants]]
parts = [
    { skeleton = "gDekuBabaSkel", pose = "gDekuBabaFastChompAnim", rotation = [-90, 0, 0], scale = 0.5 },
    { display_list = "gDekuBabaStemTopDL", translation = [0, -2000, 0], rotation = [-90, 0, 0] },
    { display_list = "gDekuBabaStemMiddleDL", translation = [0, -4000, 0], rotation = [-90, 0, 0] },
