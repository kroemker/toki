[actors.ACTOR_EN_GOMA]
name = "Gohma Larva / egg"
notes = "A Gohma egg that hatches into a Gohma Larva when Link comes near. 0 to 2 are eggs Queen Gohma lays, spawned; 6 and 7 sit on the floor, 8 and 9 hang from the ceiling (drawn 1500 below the actor rather than above). The egg is drawn at rest: it wobbles and squashes as it waits (squash 0.95 across and 1.05 tall, its turn picked at random, drawn unturned), and its texture scrolls through Gfx_TexScroll on segment 8, by a random timer, drawn at y 31 (the timer at 0) with the texture's own 16 by 16 standing in for the 0 by 0 Gfx_TexScroll is given. The larva it hatches into, at 0.005 in gObjectGolStandAnim, is not drawn, nor its eye's colour. 10 and up are the shell's 15 fragments, spawned on hatching, from gameplay_dangeon_keep, at a random 0.01 to 0.015 (drawn at 0.0125), tumbling. 100 and up are pieces of Queen Gohma as she dies, drawn with a display list she hands them at run time; drawn as a marker."
