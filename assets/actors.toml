[actors.ACTOR_OBJ_MURE]
name = "Swarm spawner"
notes = "Spawns a school of fish, bugs or butterflies at its own position when Link comes near, and takes them back when he leaves. Every one is spawned at the same point, turned as the spawner is; one child is drawn here for however many it spawns (Count, or 12, 9, 8 or 0 by Pattern when zero). With Respawn set the first butterfly gets params 1, as every vanilla placement does. Grass and the unused type fail to set their culling and remove themselves."
