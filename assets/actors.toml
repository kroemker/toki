notes = "The drawbridge across the castle moat in Hyrule Field, and its two chains, which the bridge spawns (chain 1, which spawns chain 2). Init sets the bridge's X rotation outright: raised (-90 degrees) at night as child, on scene layers 4 and 5, and once Link has the three Spiritual Stones until the Zelda's escape cutscene is seen; lowered otherwise. Drawn lowered, at the placed rotation. It is gone as adult outside cutscene layers. While raised at night (or on a cutscene layer) it draws two torch flames (gEffFire1DL, scaled from its angle, 0.008 when fully raised) at world positions (+-260, 128, 690), which are not drawn here since the lowered bridge draws none. Draw moves the chains each frame to (+-158, 10, 400) in the bridge's frame; children of children are not followed, so both chains are written as the bridge's children, and the chains keep the placed X rotation where the game tilts them to 0xF020 while raised."
