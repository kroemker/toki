[actors.ACTOR_EN_HINTNUTS]
name = "Deku Scrub (hint)"
notes = "A Deku Scrub of the Deku Tree that hides in its flower, spits nuts at Link, and when hit runs off and, caught, gives a hint (its text, the prefix of the scene's message range plus Text). Puzzle scrubs 1 to 3 must be hit in that order or the others burrow; a scrub with text 0x109B is gone once room 9's clear flag is set. A placed one spawns its flower as a child (params 10) and waits hidden in it, at frame 0 of gHintNutsUpAnim held still; drawn here standing, in gHintNutsStandAnim, the animation Init gives it, so it can be seen. Its skeleton is a flex skeleton drawn as a standard one (a bug of the game). Its nose (limb 5) squashes as it spits; not drawn. The flower is matched on the whole params being 10, as Init compares them before masking, so a scrub placed with Type 10 and nonzero Text is drawn as a flower here though it is a scrub in the game. Its nuts are En_Nutsball, spawned when it spits."
