notes = "A hand that crawls the floor and splits into three small ones when hit; they merge back unless all are killed. Init spawns the two small ones, hidden (no draw function) until it splits, so they are not drawn as children. OverrideLimbDraw moves its root limb 1600 back along Z; PostLimbDraw adds a finger at limb 2, as the Wallmaster's. Drawn in gWallmasterWaitAnim, the animation Init and its first setup give it. An invisible one is drawn translucent and seen only through the Lens of Truth; it is drawn as seen."
