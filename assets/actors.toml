    { display_list = "gDekuBabaBaseLeavesDL", translation = [0, -1400, 0] },
]

[actors.ACTOR_OBJ_SYOKUDAI]
name = "Torch"
notes = "A torch on a golden, timed or wooden stand, lit by fire or a switch. Lit also when its switch flag is set, which a scene does not say. The flame faces the camera about Y only in the game."
