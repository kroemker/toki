# What Toki calls the values of a collision surface type's settings.
#
# The decomp names most of these values only by number (FLOOR_TYPE_5), so the
# names here are read from what the game's code does with each value. A value
# with no entry is shown as its constant. Each entry is the value, the
# constant the decomp gives it, the name shown, and what the game does with it.

format = 1

[[floor_type]]
value = 0
constant = "FLOOR_TYPE_0"
name = "Default"
tooltip = "Nothing special."

[[floor_type]]
value = 1
constant = "FLOOR_TYPE_1"
name = "Camera Passes"
tooltip = "The camera takes the floor as not solid and looks for one below it."

[[floor_type]]
value = 2
constant = "FLOOR_TYPE_2"
name = "Burns"
tooltip = "Hurts Link and sets fire at his feet; in the Goron Tunic, only every 120 frames."

[[floor_type]]
value = 3
constant = "FLOOR_TYPE_3"
name = "Burns Faster"
tooltip = "Hurts Link and sets fire at his feet; in the Goron Tunic, only every 60 frames."

